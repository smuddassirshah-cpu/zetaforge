name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp:
    strategy:
      matrix:
        build_type: [Release, Debug]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install numeric dependencies
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev libflint-dev pkg-config
      - name: configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: build
        run: cmake --build build --parallel
      - name: test
        run: ctest --test-dir build --output-on-failure
      - name: emit determinism hash
        run: ./build/core/test_determinism | grep DETERMINISM_HASH > determinism_${{ matrix.build_type }}.txt && cat determinism_${{ matrix.build_type }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: determinism-${{ matrix.build_type }}
          path: determinism_${{ matrix.build_type }}.txt

  determinism-compare:
    needs: cpp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: determinism-*
      - name: require identical hashes across configurations
        run: |
          diff determinism-Release/determinism_Release.txt determinism-Debug/determinism_Debug.txt

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: test
        run: cargo test --locked --manifest-path verifier/Cargo.toml

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -e ".[dev]"
      - name: test
        run: pytest -q

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: audit dependencies
        run: |
          pip install -e "." pip-audit
          pip-audit --skip-editable

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: verifier
