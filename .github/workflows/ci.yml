name: ci

# The push trigger covers the revision branches as well as main. Through rev 6
# it named main alone, origin carried nothing but main, and so NO leg in this
# file had ever executed: the sanitisers and gate-battery legs were recorded as
# closed findings on the strength of YAML no runner had run. A CI leg that
# cannot be triggered on the branch the work lives on is not evidence.
on:
  push:
    branches: [main, 'stage4-rev*']
  pull_request:

jobs:
  cpp:
    strategy:
      matrix:
        build_type: [Release, Debug]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install numeric dependencies
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev libflint-dev pkg-config
      - name: configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: build
        run: cmake --build build --parallel
      - name: test
        run: ctest --test-dir build --output-on-failure
      - name: emit determinism hash
        run: ./build/core/test_determinism | grep DETERMINISM_HASH > determinism_${{ matrix.build_type }}.txt && cat determinism_${{ matrix.build_type }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: determinism-${{ matrix.build_type }}
          path: determinism_${{ matrix.build_type }}.txt

  determinism-compare:
    needs: cpp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: determinism-*
      - name: require identical hashes across configurations
        run: |
          diff determinism-Release/determinism_Release.txt determinism-Debug/determinism_Debug.txt

  # Debug plus AddressSanitizer and UndefinedBehaviorSanitizer, with recovery
  # off so the first report is fatal rather than a line in a log nobody reads.
  # The certified path is full of 128-bit integer arithmetic, directed rounding
  # and raw mpfr handles; a signed overflow or a leaked mpfr_t is exactly the
  # class of defect that never shows up as a failed assertion.
  sanitisers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install numeric dependencies
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev libflint-dev pkg-config
      - name: configure
        run: >
          cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
      - name: build
        run: cmake --build build-san --parallel
      - name: full ctest under the sanitisers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build-san --output-on-failure

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: test
        run: cargo test --locked --manifest-path verifier/Cargo.toml

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -e ".[dev]"
      - name: test
        run: pytest -q
      - name: theta coefficient provenance must be executable
        run: python tools/discover_theta_coefficients.py

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: audit dependencies
        run: |
          pip install -e "." pip-audit
          pip-audit --skip-editable

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: verifier

  no-env-knobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: production code must not read the environment
        run: ./tools/check_no_env_knobs.sh

  # Every row of docs/gate/ATTACKS.md, on fresh clean builds, with the tree
  # asserted diff-clean between rows. Push-only: it rebuilds the tree once per
  # row and is the gate evidence, not a per-PR smoke test.
  gate-battery:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install numeric dependencies
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev libflint-dev pkg-config
      - name: run every ATTACKS.md row
        run: ./tools/gate_battery.sh

  # The A2 residue audit as a versioned instrument (rev 7 A11). Signature
  # based, not apply based: an apply probe reported the known contaminated
  # commit as clean once context drifted, so the tool compares changed lines
  # and carries 951bfd9 as a waived incident that doubles as its positive
  # control. Full history needed: the audit walks every commit.
  mutation-residue-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: the auditor must still flag the recorded incident
        run: python3 tools/audit_mutation_residue.py --self-test
      - name: no commit may carry an unwaived mutation
        run: python3 tools/audit_mutation_residue.py --all

  sabotage-battery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install numeric dependencies
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev libflint-dev pkg-config
      - name: build with hooks ON
        run: |
          cmake -S . -B build-sab -DCMAKE_BUILD_TYPE=Release -DZF_SABOTAGE_HOOKS=ON
          cmake --build build-sab --parallel
      - name: hooked build MUST detect a scaled production radius
        run: |
          set +e
          ZF_IMPL_RADIUS_SCALE=0.1 ./build-sab/core/test_theta > /dev/null 2>&1
          rc=$?; set -e
          echo "ZF_IMPL_RADIUS_SCALE=0.1 (hooks ON) -> exit $rc"
          [ "$rc" -eq 1 ] || { echo "FAIL: expected exit 1"; exit 1; }
      - name: hooked build MUST detect a scaled transcribed bound
        run: |
          set +e
          ZF_TEST_BOUND_SCALE=0.9 ./build-sab/core/test_theta > /dev/null 2>&1
          rc=$?; set -e
          echo "ZF_TEST_BOUND_SCALE=0.9 (hooks ON) -> exit $rc"
          [ "$rc" -eq 1 ] || { echo "FAIL: expected exit 1"; exit 1; }
      - name: build with hooks OFF (production configuration)
        run: |
          cmake -S . -B build-prod -DCMAKE_BUILD_TYPE=Release
          cmake --build build-prod --parallel
      - name: production build MUST NOT respond to the knob
        run: |
          set +e
          ZF_IMPL_RADIUS_SCALE=0.1 ./build-prod/core/test_theta > /dev/null 2>&1
          rc=$?; set -e
          echo "ZF_IMPL_RADIUS_SCALE=0.1 (hooks OFF) -> exit $rc"
          [ "$rc" -eq 0 ] || { echo "FAIL: knob reached a production binary"; exit 1; }
